site_name: BodyOS Developer Documentation
site_url: https://ascentiz.github.io/bodyos-docs/
site_description: BodyOS exoskeleton developer documentation covering Exo Belt, B-core Pi 1, BodyOS SDK, APIs, and official examples.
site_author: Ascentiz
repo_url: https://github.com/ascentiz/bodyos-docs
repo_name: ascentiz/bodyos-docs
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
exclude_docs: |
  api/index.md
  api/index.zh.md
  api/control-api.md
  api/control-api.zh.md
  api/telemetry-api.md
  api/telemetry-api.zh.md
  architecture/**
  tutorials/**
  research/**
  community/**
  getting-started/**
  examples/**
  hardware/**
  integrations/**
  mechanical/**
  sdk/**
  troubleshooting/**

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/ascentiz-logo.png
  favicon: assets/images/ascentiz-logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: EN
          build: true
          site_name: BodyOS Developer Documentation
          site_description: BodyOS exoskeleton developer documentation covering Exo Belt, B-core Pi 1, BodyOS SDK, APIs, and official examples.
          copyright: Copyright &copy; 2026 Ascentiz
        - locale: zh
          name: 中
          build: true
          site_name: BodyOS 开发者文档
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Product & Hardware: 产品与硬件
            System Components & Boundaries: 系统组成与开发边界
            "Mechanical: Exo Belt": 机械结构：Exo Belt
            "Hardware: B-core Pi 1": 硬件：B-core Pi 1
            SDK Download & Installation: SDK 下载与安装
            SDK Deployment Guide: SDK 部署指南
            SDK Developer Guide: SDK 开发者手册
            API Reference: API Reference
            C++ API: C++ API
            Python API: Python API
            Integration Libraries (Planned): Integration Libraries（规划中）
            Official Examples: 官方示例

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ascentiz/bodyos-docs

nav:
  - Home: index.md
  - Product & Hardware:
      - System Components & Boundaries: product/overview.md
      - "Mechanical: Exo Belt": product/exo-belt.md
      - "Hardware: B-core Pi 1": product/b-core-pi-1.md
  - Installation:
      - SDK Download & Installation: installation/index.md
      - SDK Deployment Guide: api/PACKAGING.md
  - BodyOS SDK:
      - SDK Developer Guide: api/README.md
      - API Reference:
          - C++ API: api/C++_API_Reference.md
          - Python API: api/Python_API_Reference.md
      - Integration Libraries (Planned): api/integration-libraries.md
  - Official Examples: api/Examples_Guide.md

copyright: Copyright &copy; 2026 Ascentiz
